      <div class="gallery">

        <figure class="work" style="--w: 100%">
          <img src="images/painting-01.jpg" alt="Large abstract painting: fields of pink, orange and pale grey with a mass of cadmium yellow at centre and a deep teal sweep across the upper left.">
          <figcaption><em>Untitled</em>, 2026 &mdash; oil on canvas, 7 &times; 8 ft</figcaption>
        </figure>

        <figure class="work" style="--w: 76%">
          <img src="images/painting-02.jpg" loading="lazy" decoding="async" alt="Wide still life: a pale oval plate resting on a cobalt blue form against soft green-grey ground, a dark trapezoid behind, hot orange breaking through below.">
          <figcaption><em>Temptation</em>, 2024 &mdash; oil and acrylic on plywood, 20 &times; 50 in</figcaption>
        </figure>

        <figure class="work" style="--w: 78%">
          <img src="images/painting-03.jpg" loading="lazy" decoding="async" alt="Still life under a field of black halftone dots: three deep blue forms on pale plates, the dot screen dissolving the image toward a black border.">
          <figcaption><em>non-perishable</em>, 2025 &mdash; oil, acrylic, resin, masking tape, 40 &times; 60 in</figcaption>
        </figure>

        <figure class="work" style="--w: 58%">
          <img src="images/painting-04.jpg" loading="lazy" decoding="async" alt="Dense composition of silhouetted heads in profile on orange and violet ground, cut shapes in pink, yellow and green overlapping the figures.">
          <figcaption><em>Untitled</em>, 2023 &mdash; oil on canvas</figcaption>
        </figure>

        <figure class="work" style="--w: 62%">
          <img src="images/painting-05.jpg" loading="lazy" decoding="async" alt="Vertical abstraction in warm yellows and buff, a runnel of orange descending the right side, small bars of slate and green scattered through an open field below.">
          <figcaption><em>Autumn</em>, 2024 &mdash; oil and epoxy resin on canvas, 4 &times; 5 ft</figcaption>
        </figure>

        <figure class="work" style="--w: 72%">
          <img src="images/painting-06.jpg" loading="lazy" decoding="async" alt="Bold abstraction: a red-orange frame holding green and dripping yellow at lower left, a mustard field of white thumbprint dots at right, ochre and plum patches above.">
          <figcaption><em>some left over</em>, 2025 &mdash; 4 &times; 4 ft</figcaption>
        </figure>

        <figure class="work" style="--w: 100%">
          <div class="work-row">
          <img src="images/painting-07.jpg" loading="lazy" decoding="async" alt="Black and white screenprint: a small silhouetted figure standing at the base of an enormous arc of swirled strokes filling the sheet above.">
          <img src="images/painting-08.jpg" loading="lazy" decoding="async" alt="Black and white screenprint: fields of scraped texture crossed by long straight scored lines, dark blooms gathering toward the lower centre.">
          <img src="images/painting-09.jpg" loading="lazy" decoding="async" alt="Black and white screenprint: horizontal streaks running the width of the sheet, dark clustered forms dissolving into the banding.">
          </div>
          <figcaption><em>83 Brook St</em>, 2025 &mdash; screenprints</figcaption>
        </figure>

        <figure class="work" style="--w: 48%">
          <img src="images/painting-10.jpg" loading="lazy" decoding="async" alt="Work with a deep ultramarine border: an arched mass of thick torn paint skins in yellow, black, pink, sky blue and flesh tones, layered and cracking.">
          <figcaption><em>mailbox, lunchbox, shovel</em>, 2025 &mdash; tin, acrylic peeling</figcaption>
        </figure>

        <figure class="work" style="--w: 86%">
          <img src="images/painting-11.jpg" loading="lazy" decoding="async" alt="A grinning yellow toy head tilted across the right half, interleaved in horizontal bands with a collaged grid of branches, orange and blue at left.">
          <figcaption><em>Head transplant</em>, 2025 &mdash; 50 &times; 72 in</figcaption>
        </figure>

        <figure class="work" style="--w: 66%">
          <img src="images/painting-12.jpg" loading="lazy" decoding="async" alt="Wide panel: a rounded frame drawn in black holding a grey-green field over a dense blue gridded thicket, on a salmon pink ground.">
          <figcaption><em>envision</em>, 2025 &mdash; acrylic on wood, 30 &times; 50 in</figcaption>
        </figure>

        <figure class="work" style="--w: 90%">
          <img src="images/painting-13.jpg" loading="lazy" decoding="async" alt="Near-square abstraction in pale pink, yellow and grey, thin washes and drips pooling over a soft under-structure.">
          <figcaption><em>temporal</em>, 2024 &mdash; oil on canvas, 5 &times; 6 ft</figcaption>
        </figure>

        <figure class="work" style="--w: 46%">
          <img src="images/painting-14.jpg" loading="lazy" decoding="async" alt="Installation in a corner painted bright green: three pink faux-fur forms mounted on the wall above artificial turf, wall text reading Victor Chiu, Alex Wu.">
          <figcaption><em>centaur</em> (with Alex Wu), 2025 &mdash; multimedia installation</figcaption>
        </figure>

        <figure class="work" style="--w: 94%">
          <img src="images/painting-15.jpg" loading="lazy" decoding="async" alt="Wide, misty abstraction: layers of washed blue, green and grey building a landscape-like mass, a blush of red at upper left and deep turquoise pooling below.">
          <figcaption><em>obsolescence</em>, 2025 &mdash; oil on canvas, 6 &times; 7 ft</figcaption>
        </figure>
